
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Inventory Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Product Inventory Manager</h1>
        <p>Manage your products easily</p>
    </header>


    <main>

        <!-- Add Product -->
        <section class="section">

            <h2>Add Product</h2>

            <form id="product-form">

                <div class="form-group">
                    <label for="product-id">
                        Product ID
                    </label>

                    <input
                        type="text"
                        id="product-id"
                        placeholder="Enter product ID"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="product-name">
                        Product Name
                    </label>

                    <input
                        type="text"
                        id="product-name"
                        placeholder="Enter product name"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="product-price">
                        Price
                    </label>

                    <input
                        type="number"
                        id="product-price"
                        placeholder="Enter price"
                        min="0"
                        step="0.01"
                        required
                    >
                </div>


                <div class="stock-option">

                    <input
                        type="checkbox"
                        id="product-instock"
                    >

                    <label for="product-instock">
                        Product is in stock
                    </label>

                </div>


                <button
                    type="submit"
                    class="add-btn"
                >
                    Add Product
                </button>

            </form>

        </section>


        <!-- Inventory Controls -->
        <section class="section">

            <h2>Inventory</h2>

            <div class="controls">

                <button
                    type="button"
                    id="show-all-btn"
                    class="btn active"
                >
                    Show All
                </button>


                <button
                    type="button"
                    id="show-available-btn"
                    class="btn"
                >
                    Show Available
                </button>

            </div>

        </section>


        <!-- Products -->
        <section class="section">

            <h2>Products</h2>

            <div class="table-container">

                <table>

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Product Name</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Action</th>
                        </tr>

                    </thead>


                    <tbody id="inventory-table-body">
                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <footer>
        Product Inventory Manager
    </footer>


    <script src="app.js"></script>

</body>

</html>
